<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>여자 연예인 성향 테스트</title>
    <style>
        body { background-color: #fff5f7; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 450px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .progress { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; }
        .bar { width: 0%; height: 100%; background: #ff6b81; border-radius: 3px; transition: 0.3s; }
        .q-box { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .btn { width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ffccd5; border-radius: 12px; background: white; cursor: pointer; font-size: 0.95rem; }
        .btn:hover { background: #ff6b81; color: white; }
        #result { display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz">
            <div class="progress"><div id="bar" class="bar"></div></div>
            <div id="q-text" class="q-box"></div>
            <div id="btns"></div>
        </div>
        <div id="result">
            <h2 id="res-title"></h2>
            <p id="res-desc"></p>
            <button class="btn" onclick="location.reload()">다시하기</button>
        </div>
    </div>
    <script>
        const qList = [
            {q: "약속 취소! 나의 첫 반응은?", opt: [{t:"오히려 좋아, 넷플릭스",v:"제니"}, {t:"당장 다른 약속 찾기",v:"이효리"}, {t:"혼자 맛집 투어",v:"수지"}, {t:"생산적인 집안일",v:"아이유"}]},
            {q: "해외여행 포지션은?", opt: [{t:"인생샷 포토그래퍼",v:"제니"}, {t:"분위기 메이커 대장",v:"이효리"}, {t:"일정 조율 실속파",v:"수지"}, {t:"완벽 계획 브레인",v:"아이유"}]},
            {q: "누군가 어이없는 실수를 하면?", opt: [{t:"신경 안 쓰고 내 할 일",v:"제니"}, {t:"쿨하게 웃어넘기기",v:"이효리"}, {t:"부드럽게 화제 전환",v:"수지"}, {t:"차분히 문제 짚어주기",v:"아이유"}]},
            {q: "일/과제 처리 스타일은?", opt: [{t:"집중력 폭발, 몰아서 끝냄",v:"제니"}, {t:"흐름대로 유연하게",v:"이효리"}, {t:"꼼꼼하고 차분하게",v:"수지"}, {t:"마감 전 완벽 끝내기",v:"아이유"}]},
            {q: "첫 만남 자리에서 나는?", opt: [{t:"힙한 아우라로 시선집중",v:"제니"}, {t:"솔직 털털한 입담",v:"이효리"}, {t:"조용히 경청하기",v:"수지"}, {t:"예의 바른 역할 수행",v:"아이유"}]},
            {q: "이유 없는 잔소리 대처는?", opt: [{t:"표정 관리하며 수용",v:"제니"}, {t:"한 귀로 듣고 흘리기",v:"이효리"}, {t:"지혜롭게 받아치기",v:"수지"}, {t:"논리적 반박 생각",v:"아이유"}]},
            {q: "폰 정리 상태는?", opt: [{t:"감성 배경, 예쁜 배열",v:"제니"}, {t:"안 읽은 톡 999+개",v:"이효리"}, {t:"깔끔한 대화방 정리",v:"수지"}, {t:"폴더별 완벽 칼각",v:"아이유"}]},
            {q: "로또 1등 당첨된다면?", opt: [{t:"멋진 패션 아이템 지름",v:"제니"}, {t:"주변에 통 크게 쓰기",v:"이효리"}, {t:"평소처럼 조용히 저축",v:"수지"}, {t:"차분한 미래 설계",v:"아이유"}]},
            {q: "가장 중요한 가치는?", opt: [{t:"나만의 유니크함",v:"제니"}, {t:"온전한 나의 자유",v:"이효리"}, {t:"주변을 지키는 따뜻함",v:"수지"}, {t:"끊임없는 성취감",v:"아이유"}]},
            {q: "잘못 나온 메뉴 대처는?", opt: [{t:"그냥 주는 대로 먹음",v:"제니"}, {t:"웃으며 교체 요청",v:"이효리"}, {t:"정중히 재요청",v:"수지"}, {t:"영수증 확인 후 요청",v:"아이유"}]},
            {q: "멘탈 바닥일 때 극복법은?", opt: [{t:"친구와 맛있는 수다",v:"제니"}, {t:"자연 속으로 떠나기",v:"이효리"}, {t:"따뜻한 차 마시며 명상",v:"수지"}, {t:"일기 쓰며 생각 정리",v:"아이유"}]},
            {q: "듣고 싶은 칭찬은?", opt: [{t:"대체 불가능한 매력",v:"제니"}, {t:"같이 있으면 편안해",v:"이효리"}, {t:"마음이 깊은 사람",v:"수지"}, {t:"성실하고 배울 점 많아",v:"아이유"}]},
            {q: "쇼핑할 때 성향은?", opt: [{t:"힙한 디자인에 꽂힘",v:"제니"}, {t:"가성비와 편안함",v:"이효리"}, {t:"오래 쓰는 깔끔함",v:"수지"}, {t:"필요성 꼼꼼 체크",v:"아이유"}]},
            {q: "논쟁이 붙었을 때?", opt: [{t:"내 주관은 확실히",v:"제니"}, {t:"서로 생각이 다른 거지",v:"이효리"}, {t:"부드럽게 중재",v:"수지"}, {t:"이성적 근거 제시",v:"아이유"}]},
            {q: "완벽한 하루 마무리란?", opt: [{t:"하고 싶은 일 다 즐겼을 때",v:"제니"}, {t:"스트레스 없이 쉴 때",v:"이효리"}, {t:"소중한 사람과 보냈을 때",v:"수지"}, {t:"목표를 달성했을 때",v:"아이유"}]}
        ];
        let idx = 0, score = { "제니":0, "이효리":0, "수지":0, "아이유":0 };
        function start() {
            let q = qList[idx];
            document.getElementById('bar').style.width = ((idx)/qList.length)*100 + "%";
            document.getElementById('q-text').innerText = (idx+1) + ". " + q.q;
            let b = document.getElementById('btns'); b.innerHTML = '';
            q.opt.forEach(o => {
                let btn = document.createElement('button');
                btn.className = 'btn'; btn.innerText = o.t;
                btn.onclick = () => { score[o.v]++; idx++; idx == qList.length ? show() : start(); };
                b.appendChild(btn);
            });
        }
        function show() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            let best = Object.keys(score).reduce((a, b) => score[a] > score[b] ? a : b);
            document.getElementById('res-title').innerText = "당신은 " + best + " 재질!";
            document.getElementById('res-desc').innerText = "테스트 결과입니다.";
        }
        start();
    </script>
</body>
</html>
