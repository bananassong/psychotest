<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 연예인이라면? (여자편)</title>
    <style>
        :root {
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --border: #ffe4e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 30px; padding: 40px; border: 2px solid var(--border); box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3); }
        .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
        .question-box { font-size: 1.15rem; font-weight: 700; margin-bottom: 25px; text-align: center; line-height: 1.5; color: var(--text-main); }
        .option-btn { background: #fff; border: 2px solid #ffccd5; border-radius: 20px; padding: 16px 20px; margin-bottom: 12px; width: 100%; text-align: left; cursor: pointer; color: var(--text-main); font-weight: 600; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover { border-color: var(--primary); background: var(--primary); color: white; transform: translateY(-2px); }
        .result-box { display: none; text-align: center; }
        .result-title { color: var(--primary); font-size: 1.6rem; font-weight: 800; margin-bottom: 15px; }
        .result-desc { background: #fff5f7; padding: 25px; border-radius: 20px; text-align: left; line-height: 1.7; color: var(--text-sub); border: 1px solid var(--border); margin-bottom: 25px; }
        .restart-btn { background: var(--primary); color: white; border: none; border-radius: 20px; padding: 16px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1.1rem; transition: 0.2s; }
        .restart-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz-screen">
            <h1 style="text-align:center; margin-bottom:20px; font-size:1.4rem; color:var(--primary);">✨ 내가 여자 연예인이라면?</h1>
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
            <div class="question-box" id="question-text">문항 로딩중...</div>
            <div id="options-container"></div>
        </div>
        <div class="result-box" id="result-screen">
            <h2 id="result-title" class="result-title"></h2>
            <div id="result-desc" class="result-desc"></div>
            <button class="restart-btn" onclick="location.href='index.html'">메인으로 돌아가기</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "주말에 갑자기 약속이 다 취소되었다. 나의 첫 반응은?", options: [
                {t: "1. 오 오히려 좋아! 집에서 넷플릭스 정주행을 시작한다", v: "제니"},
                {t: "2. 바로 친구들을 수소문해서 새로운 약속을 잡는다", v: "이효리"},
                {t: "3. 예쁜 카페나 맛집 리스트를 열어 혼자 힐링하러 나간다", v: "수지"},
                {t: "4. 밀린 집안일을 하거나 혼자만의 생산적인 시간을 보낸다", v: "아이유"}
            ]},
            { q: "친구들과 해외여행을 가게 되었다. 나의 포지션은?", options: [
                {t: "1. 사진 핫플과 예쁜 스팟을 기가 막히게 찾아내는 포토그래퍼", v: "제니"},
                {t: "2. 분위기를 주도하고 언니 동생들을 챙기는 대장", v: "이효리"},
                {t: "3. 묵묵히 짐을 챙기고 전체적인 일정을 조율하는 실속파", v: "수지"},
                {t: "4. 가성비와 동선을 철저하게 분석해서 완벽한 계획을 짜는 브레인", v: "아이유"}
            ]},
            { q: "회의나 모임에서 누군가 말도 안 되는 실수를 저질렀을 때?", options: [
                {t: "1. 쿨하게 넘어갈 수도 있지 하고 대수롭지 않게 웃어넘긴다", v: "이효리"},
                {t: "2. 속으로 살짝 당황하지만 부드럽게 다른 주제로 화제를 돌린다", v: "수지"},
                {t: "3. 차분하게 무엇이 문제였는지 조목조목 짚어준다", v: "아이유"},
                {t: "4. 크게 신경 쓰지 않고 내 할 일에 집중한다", v: "제니"}
            ]},
            { q: "내가 일이나 과제를 처리하는 방식을 고른다면?", options: [
                {t: "1. 마감 기한보다 훨씬 전에 미리 완벽하게 끝내놓는다", v: "아이유"},
                {t: "2. 집중력이 폭발할 때 한 번에 몰아서 끝장낸다", v: "제니"},
                {t: "3. 흐름에 몸을 맡기고 유연하게 그때그때 처리한다", v: "이효리"},
                {t: "4. 꼼꼼하고 차분하게 실수를 줄이며 차근차근 해낸다", v: "수지"}
            ]},
            { q: "새로운 사람들과 처음 만나는 자리에서 나는?", options: [
                {t: "1. 솔직하고 털털한 입담으로 금방 분위기를 내 편으로 만든다", v: "이효리"},
                {t: "2. 조용히 미소 지으며 상대방의 이야기를 경청한다", v: "수지"},
                {t: "3. 힙하고 트렌디한 아라로 시선을 사로잡는다", v: "제니"},
                {t: "4. 예의 바르고 단정하게 내 몫의 역할을 해낸다", v: "아이유"}
            ]},
            { q: "누군가 나에게 이유 없는 잔소리를 할 때 나의 대처는?", options: [
                {t: "1. 한 귀로 듣고 한 귀로 흘리며 속으로 웃는다", v: "이효리"},
                {t: "2. 표정 관리가 살짝 안 되지만 적당히 수용하는 척한다", v: "제니"},
                {t: "3. 상대방의 기분이 상하지 않게 지혜롭게 잘 받아친다", v: "수지"},
                {t: "4. 속으로 논리적인 반박을 완성하지만 대꾸는 아낀다", v: "아이유"}
            ]},
            { q: "스마트폰 앱이나 카톡 창을 정리하는 나의 습관은?", options: [
                {t: "1. 안 읽은 메시지 999+개, 알림은 거의 다 꺼두는 편", v: "이효리"},
                {t: "2. 폴더별로 깔끔하게 정리되어 있어야 마음이 편안하다", v: "아이유"},
                {t: "3. 감성적인 배경화면과 예쁜 아이콘 배열을 유지한다", v: "제니"},
                {t: "4. 필요한 것만 딱 두고 대화방도 주기적으로 정리한다", v: "수지"}
            ]},
            { q: "길을 가다가 우연히 로또 1등에 당첨된다면?", options: [
                {t: "1. 가족들에게 바로 알리고 좋은 일에 통 크게 쓴다", v: "이효리"},
                {t: "2. 당장 멋진 작업실이나 사고 싶었던 패션 아이템을 지른다", v: "제니"},
                {t: "3. 조용히 저축해 두고 평소랑 똑같이 차분하게 일상을 보낸다", v: "아이유"},
                {t: "4. 주변 지인들에게 맛있는 걸 사고 미래를 차분히 설계한다", v: "수지"}
            ]},
            { q: "인생을 살아갈 때 내가 가장 중요하게 여겨야 하는 가치는?", options: [
                {t: "1. 타인의 시선에 얽매이지 않는 온전한 나의 자유", v: "이효리"},
                {t: "2. 남들이 따라올 수 없는 나만의 유니크한 개성과 멋", v: "제니"},
                {t: "3. 내 주변 사람들을 지키는 따뜻한 마음과 책임감", v: "수지"},
                {t: "4. 끊임없이 성장하는 성취감과 내실 있는 삶", v: "아이유"}
            ]},
            { q: "식당에 갔는데 내가 주문한 메뉴가 완전히 잘못 나왔다. 이때 나는?", options: [
                {t: "1. 아 이거 주문이 잘못 들어갔네요~ 바꿔주세요 하고 쿨하게 말함", v: "이효리"},
                {t: "2. 조용히 직원분을 불러서 메뉴 교체를 정중하게 요청한다", v: "수지"},
                {t: "3. 그냥 배고프면 주는 대로 맛있게 먹는 편이다", v: "제니"},
                {t: "4. 영수증을 확인하고 정확하게 다시 요청한다", v: "아이유"}
            ]},
            { q: "힘든 일이 생겨서 멘탈이 바닥을 칠 때 나만의 극복 방법은?", options: [
                {t: "1. 자연 속으로 떠나거나 땀 흘리며 운동으로 날려버린다", v: "이효리"},
                {t: "2. 혼자 방에 들어가 음악을 듣거나 일기를 쓰며 생각을 정리한다", v: "아이유"},
                {t: "3. 믿을 만한 친구와 맛있는 것을 먹으며 수다를 떤다", v: "제니"},
                {t: "4. 조용히 따뜻한 차를 마시며 마인드 컨트롤을 한다", v: "수지"}
            ]},
            { q: "남들이 나를 평가할 때 가장 듣기 좋은 칭찬은?", options: [
                {t: "1. \"너는 정말 대체 불가능한 멋진 매력이 있어\"", v: "제니"},
                {t: "2. \"너랑 있으면 정말 편안하고 에너지가 좋아져\"", v: "이효리"},
                {t: "3. \"정말 다정하고 마음이 깊은 사람이야\"", v: "수지"},
                {t: "4. \"어쩜 그렇게 늘 성실하고 배울 점이 많니\"", v: "아이유"}
            ]},
            { q: "쇼핑을 할 때 나의 소비 패턴과 성향은?", options: [
                {t: "1. 유행을 선도하는 힙한 브랜드나 디자인에 눈이 간다", v: "제니"},
                {t: "2. 실용적이고 오래 입을 수 있는 깔끔한 스타일을 선호한다", v: "수지"},
                {t: "3. 디자인보다는 내가 편하게 입고 쓸 수 있는 가성비 위주", v: "이효리"},
                {t: "4. 꼭 필요한 물건인지 꼼꼼히 따져보고 계획적으로 구매한다", v: "아이유"}
            ]},
            { q: "대화를 하다가 의견 충돌이나 논쟁이 붙었을 때 나는?", options: [
                {t: "1. 서로 각자의 생각이 있는 거지 하고 상대방을 존중한다", v: "이효리"},
                {t: "2. 감정이 상하지 않게 부드럽게 양쪽 입장을 중재한다", v: "수지"},
                {t: "3. 내 주관을 확실하게 표현하되 피곤한 싸움은 피한다", v: "제니"},
                {t: "4. 이성적인 근거를 바탕으로 조용히 내 의견을 피력한다", v: "아이유"}
            ]},
            { q: "오늘 하루를 완벽하게 마무리했다고 느끼는 순간은 언제인가?", options: [
                {t: "1. 오늘 세운 목표를 완벽하게 달성하고 뿌듯함을 느낄 때", v: "아이유"},
                {t: "2. 오늘 하루 내가 하고 싶은 일들을 온전히 즐겼을 때", v: "제니"},
                {t: "3. 사랑하는 사람들과 소중하고 행복한 시간을 보냈을 때", v: "수지"},
                {t: "4. 아무 스트레스 없이 편안하게 푹 쉴 수 있을 때", v: "이효리"}
            ]}
        ];

        const results = {
            "제니": { title: "🔥 대체 불가 트렌드 아이콘 (제니 재질)", desc: "어디서나 스포트라이트를 받는 독보적인 분위기! 힙한 감각과 자신만의 확고한 스타일로 트렌드를 이끄는 트렌드세터입니다." },
            "이효리": { title: "⭐ 시대를 흔드는 만능 슈퍼스타 (이효리 재질)", desc: "꾸밈없는 솔직함과 어디서나 빛나는 엄청난 아라! 주변을 유쾌하게 만들고 자유로운 에너지를 뿜어내는 타고난 연예인입니다." },
            "수지": { title: "🌸 모두가 사랑하는 국민 아이콘 (수지 재질)", desc: "청순한 비주얼 뒤에 숨겨진 단단하고 속 깊은 내면! 주변 사람들을 다정하게 챙기며 깊은 신뢰를 주는 워너비 스타일입니다." },
            "아이유": { title: "📚 똑 소리 나는 감성 싱어송라이터 (아이유 재질)", desc: "철저한 자기관리와 뛰어난 실력, 그리고 깊은 생각! 조용하지만 강한 내공으로 사람들의 마음에 진한 울림을 주는 능력자입니다." }
        };

        let currentQ = 0;
        let scores = { "제니": 0, "이효리": 0, "수지": 0, "아이유": 0 };

        function loadQ() {
            if (currentQ >= questions.length) {
                showResult();
                return;
            }
            let progressPercent = (currentQ / questions.length) * 100;
            document.getElementById('progress').style.width = progressPercent + '%';

            const qObj = questions[currentQ];
            document.getElementById('question-text').innerText = (currentQ + 1) + ". " + qObj.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            qObj.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.t;
                btn.onclick = () => {
                    scores[opt.v]++;
                    currentQ++;
                    loadQ();
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let bestType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

            document.getElementById('result-title').innerText = results[bestType].title;
            document.getElementById('result-desc').innerText = results[bestType].desc;
        }

        loadQ();
    </script>
</body>
</html>
