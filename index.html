<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심리테스트 모음집</title>
    <style>
        body { 
            background-color: #fff5f7; /* 부드러운 파스텔 핑크 배경 */
            font-family: 'Pretendard', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
        }
        .container { 
            width: 90%; 
            max-width: 450px; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3); /* 부드러운 그림자 */
            border: 2px solid #ffe4e6;
        }
        h1 { 
            color: #ff6b81; 
            font-size: 1.5rem; 
            margin-bottom: 30px; 
        }
        .menu-btn { 
            display: block; 
            width: 90%; 
            margin: 0 auto 15px auto; /* 중앙 정렬 */
            padding: 18px; 
            background: #fff; 
            border: 2px solid #ffccd5; 
            color: #ff6b81; 
            border-radius: 20px; 
            text-decoration: none; 
            font-weight: 700; 
            transition: all 0.3s; 
        }
        .menu-btn:hover { 
            background: #ff6b81; 
            color: white; 
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 심리테스트 모음집</h1>
        <a href="control.html" class="menu-btn">🔥 통제광 레벨 테스트</a>
        <a href="celebrity.html" class="menu-btn">✨ 내가 연예인이라면? (남자편)</a>
        <a href="celebrity_girl.html" class="menu-btn">💖 내가 연예인이라면? (여자편)</a>
    </div>
</body>
</html>
