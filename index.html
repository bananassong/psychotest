<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 통제광 테스트</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 40px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 10px;
            color: var(--text);
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #fdfdff;
            transform: translateY(-2px);
        }

        .result-box {
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .result-desc {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 30px;
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 테스트 진행 화면 -->
        <div id="quiz-screen">
            <h1>🧠 나의 통제광 레벨 테스트</h1>
            <p class="subtitle">피도 눈물도 없는 일상 속 통제 성향을 알아보세요!</p>
            
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question-box" id="question-text">
                문장이 여기에 들어갑니다.
            </div>

            <div class="options" id="options-container">
                <!-- 버튼들이 자바스크립트로 들어갑니다 -->
            </div>
        </div>

        <!-- 결과 화면 -->
        <div class="result-box" id="result-screen">
            <h2 class="result-title" id="result-title">결과 타이틀</h2>
            <div class="result-desc" id="result-desc">
                결과 설명이 여기에 들어갑니다.
            </div>
            <button class="restart-btn" onclick="restartQuiz()">다시 테스트하기</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "약속 시간이 다 되어 가는데 친구가 아직 출발도 안 했다고 연락이 왔다. 나의 반응은?",
                options: [
                    { text: "1. (이미 예상했음) 대체 왜 저러는지 이해하려 애쓴다.", score: 1 },
                    { text: "2. 언제까지 올 수 있는지 정확한 시간을 받아내고 일정을 재조정한다.", score: 3 },
                    { text: "3. 내 계획이 틀어져서 속에서 스팀이 오르기 시작한다.", score: 5 }
                ]
            },
            {
                q: "여럿이서 여행을 갈 때, 일정표를 짜는 나의 모습은?",
                options: [
                    { text: "1. 총대 매고 분 단위까지 엑셀로 완벽하게 마스터플랜을 짠다.", score: 5 },
                    { text: "2. 큰 틀만 내가 짜고 세부적인 건 현장 상황에 맡긴다.", score: 3 },
                    { text: "3. 남이 짜주는 일정에 조용히 따라가는 게 젤 편하다.", score: 1 }
                ]
            },
            {
                q: "다른 사람이 내 물건을 허락 없이 만지거나 제자리에 두지 않았을 때?",
                options: [
                    { text: "1. 쓸 수만 있으면 상관없지 뭐~ 신경 안 씀", score: 1 },
                    { text: "2. 약간 찝찝하지만 속으로만 생각하고 넘어간다.", score: 3 },
                    { text: "3. 눈썹이 씰룩거리며 원래 있던 각도와 위치로 칼같이 돌려놓는다.", score: 5 }
                ]
            },
            {
                q: "요리를 할 때 레시피를 대하는 나의 태도는?",
                options: [
                    { text: "1. 감으로 때려 넣기! 대충 눈대중으로 만드는 게 맛이지.", score: 1 },
                    { text: "2. 대략적인 레시피를 보되 내 입맛대로 가감한다.", score: 3 },
                    { text: "3. 그램(g) 수와 불 조절 타이머까지 완벽하게 지킨다.", score: 5 }
                ]
            },
            {
                q: "팀 과제나 회사 업무를 공동으로 진행할 때?",
                options: [
                    { text: "1. 각자 알아서 잘하겠지 믿고 맡긴다.", score: 1 },
                    { text: "2. 중간중간 진행 상황을 체크하며 피드백을 준다.", score: 3 },
                    { text: "3. 남이 한 결과물이 성에 차지 않아 차라리 내가 다 해버린다.", score: 5 }
                ]
            },
            {
                q: "내 차나 방에 누군가를 태웠거나 초대했을 때 가장 거슬리는 것은?",
                options: [
                    { text: "1. 사람이 오는데 이 정도 어지러움쯤이야 대수롭지 않다.", score: 1 },
                    { text: "2. 쓰레기나 눈에 띄는 큰 먼지만 대충 치운다.", score: 3 },
                    { text: "3. 타자마자 신발 정돈, 안전띠 위치, 쓰레기 무단 투기 여부를 매의 눈으로 스캔한다.", score: 5 }
                ]
            },
            {
                q: "내가 세운 계획이 뜻밖의 변수 때문에 틀어지게 되었을 때?",
                options: [
                    { text: "1. \"뭐 어때~ 플랜 B로 가지 뭐!\" 하고 유연하게 대처한다.", score: 1 },
                    { text: "2. 살짝 당황스럽지만 이내 마음을 가라앉히고 수습한다.", score: 3 },
                    { text: "3. 머릿속이 하얘지면서 짜증이 밀려오고 온종일 기분이 찝찝하다.", score: 5 }
                ]
            },
            {
                q: "식당이나 카페에서 주문을 할 때 내 스타일은?",
                options: [
                    { text: "1. 추천 메뉴나 베스트 메뉴로 대충 시킨다.", score: 1 },
                    { text: "2. 평소 먹던 안전한 메뉴로 주문한다.", score: 3 },
                    { text: "3. 시럽 빼고, 얼음 적게, 온도는 미지근하게 등 옵션을 완벽히 커스텀한다.", score: 5 }
                ]
            },
            {
                q: "누군가와 대화를 하거나 토론을 할 때 나의 모습은?",
                options: [
                    { text: "1. 상대방의 의견을 경청하고 고개 끄덕여주는 편이다.", score: 1 },
                    { text: "2. 흐름에 따라 내 의견을 적절히 조율하며 말한다.", score: 3 },
                    { text: "3. 논리적인 오류나 내 생각과 다른 점을 못 참고 끝까지 바로잡으려 한다.", score: 5 }
                ]
            },
            {
                q: "스마트폰 알림 아이콘(빨간색 배지)이나 카톡 안 읽은 숫자를 보면?",
                options: [
                    { text: "1. 쌓여있든 말든 별로 신경 쓰지 않는다.", score: 1 },
                    { text: "2. 거슬릴 때 가끔 모아서 정리한다.", score: 5 },
                    { text: "3. 무조건 들어가서 숫자를 \"0\"으로 만들어야 직성이 풀린다.", score: 5 }
                ]
            },
            {
                q: "물건을 살 때 후기를 찾아보는 스타일은?",
                options: [
                    { text: "1. 대충 마음에 들면 바로 결제한다.", score: 1 },
                    { text: "2. 베스트 리뷰 몇 개 읽어보고 결정한다.", score: 3 },
                    { text: "3. 별점 1점, 2점짜리 안 좋은 리뷰부터 최신순까지 싹 다 분석하고 실패 확률을 0%로 만든다.", score: 5 }
                ]
            },
            {
                q: "누가 내 스마트폰 화면을 옆에서 힐끗 볼 때 나의 반응은?",
                options: [
                    { text: "1. 보든 말든 아무 생각 없다.", score: 1 },
                    { text: "2. 약간 민망하지만 크게 신경 쓰지 않는다.", score: 3 },
                    { text: "3. 기분이 급격히 나빠지며 은근히 화면을 가리거나 폰을 끈다.", score: 5 }
                ]
            },
            {
                q: "인생을 살아가면서 가장 중요하게 생각하는 가치는?",
                options: [
                    { text: "1. 흘러가는 대로 유유자적하게 사는 것", score: 1 },
                    { text: "2. 적당한 안정과 소소한 행복", score: 3 },
                    { text: "3. 내 손으로 내 미래와 주변 상황을 확실하게 통제하는 것", score: 5 }
                ]
            },
            {
                q: "친구들과 게임이나 내기를 할 때 나의 태도는?",
                options: [
                    { text: "1. 승패에 연연하지 않고 그냥 노는 것 자체가 즐겁다.", score: 1 },
                    { text: "2. 이기면 좋고 지어도 그만이다.", score: 3 },
                    { text: "3. 규칙을 철저하게 따져가며 무조건 이기려고 전략을 짠다.", score: 5 }
                ]
            },
            {
                q: "내 방 책상이나 스마트폰 배경화면 정리 상태는?",
                options: [
                    { text: "1. 어디에 뭐가 있는지 나만 알면 되는 자유분방한 상태", score: 1 },
                    { text: "2. 주기적으로 대청소나 폴더 정리를 한다.", score: 3 },
                    { text: "3. 아이콘 줄맞춤부터 폴더링, 서랍 속 물건 위치까지 오차 없이 완벽하다.", score: 5 }
                ]
            }
        ];

        const results = [
            {
                min: 15, max: 25,
                title: "🌿 자연인형 무소유 통제 제로러",
                desc: "당신은 바람 부는 대로, 물 흐르는 대로 살아가는 자연인 스타일입니다! 주변 상황이나 타인에게 거의 집착하지 않고, 변수가 생겨도 \"인생은 원래 그런 거지~\" 하고 넘기는 초연한 영혼의 소유자입니다. 가끔은 너무 허술해서 주변 사람들이 대신 걱정할 수도 있지만, 그 낙천적인 매력이 당신의 가장 큰 무기입니다."
            },
            {
                min: 26, max: 50,
                title: "⚖️ 유연한 현실주의 스마트 통제러",
                desc: "당신은 평소에는 느긋하고 유연하지만, 꼭 필요한 순간에는 칼같이 상황을 통제할 줄 아는 지혜로운 사람이군요! 계획이 틀어져도 플랜 B를 찾을 줄 아는 여유가 있으며, 타인의 영역을 존중해 줄 아는 멋진 마인드를 가졌습니다. 완벽주의와 여유로움의 밸런스가 아주 잘 잡혀 있는 타입입니다."
            },
            {
                min: 51, max: 75,
                title: "🚨 일상 장악형 프로 통제광",
                desc: "당신은 내 주변의 모든 상황과 일정이 내 통제하에 있어야 마음이 편안해지는 프로 통제광입니다! 꼼꼼하고 완벽하게 준비하는 능력이 뛰어나서 일 처리나 일상생활에서 실수가 거의 없지만, 가끔 예상치 못한 변수가 생기거나 주변 사람이 내 뜻대로 움직여주지 않으면 스트레스를 크게 받을 수 있어요. 가끔은 '에라 모르겠다' 하고 내려놓는 연습도 필요하답니다!"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionText.innerText = `${currentQuestion + 1}. ${q.q}`;
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.score);
                optionsContainer.appendChild(btn);
            });

            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function selectOption(selectedScore) {
            score += selectedScore;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            progressBar.style.width = '100%';

            let matchedResult = results[0];
            for (let r of results) {
                if (score >= r.min && score <= r.max) {
                    matchedResult = r;
                    break;
                }
            }

            resultTitle.innerText = `당신의 결과: ${matchedResult.title}`;
            resultDesc.innerText = matchedResult.desc;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
