<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내가 연예인이라면? (남자편)</title>
    <style>
        body { background: #fff5f7; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: white; border: 2px solid #ffccd5; border-radius: 15px; cursor: pointer; text-align: left; font-weight: 600; }
        .option-btn:hover { background: #ff6b81; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz-screen">
            <h2 id="q-text">질문이 여기에 나옵니다</h2>
            <div id="options"></div>
        </div>
        <div id="result-screen" style="display:none; text-align:center;">
            <h2 id="res-title"></h2>
            <p id="res-desc"></p>
            <button class="option-btn" onclick="location.href='index.html'">메인으로</button>
        </div>
    </div>
    <script>
        const questions = [
            { q: "주말 약속이 취소되었다. 나의 첫 반응은?", options: [{t:"혼자만의 시간 너무 좋다", v:"침착맨"}, {t:"당장 다른 사람 호출", v:"유재석"}, {t:"집에서 유튜브 봐야지", v:"곽튜브"}, {t:"꾸미고 핫플 간다", v:"큐영"}, {t:"하던 일 마저 한다", v:"정일영"}, {t:"그냥 누워있는다", v:"기안84"}] },
            { q: "친구들과 여행, 나는 어떤 포지션?", options: [{t:"계획 짜는 리더", v:"유재석"}, {t:"맛집 다 찾아둔 정보왕", v:"곽튜브"}, {t:"분위기 메이커", v:"정일영"}, {t:"패션 담당", v:"큐영"}, {t:"그냥 따라감", v:"기안84"}, {t:"멍 때리다 뼈 때리는 말", v:"침착맨"}] },
            { q: "일 처리를 할 때 나의 방식은?", options: [{t:"완벽하고 꼼꼼하게", v:"유재석"}, {t:"효율적으로 빠르게", v:"곽튜브"}, {t:"직관과 센스로", v:"정일영"}, {t:"내 감각대로", v:"큐영"}, {t:"그때그때 생각나는 대로", v:"기안84"}, {t:"되는대로 대충", v:"침착맨"}] },
            // ... (이렇게 15번까지 반복)
            { q: "15. 마지막 선택, 내가 가장 추구하는 것은?", options: [{t:"성공과 인정", v:"유재석"}, {t:"재미와 유머", v:"침착맨"}, {t:"자유와 여행", v:"곽튜브"}, {t:"개성과 스타일", v:"큐영"}, {t:"성취와 열정", v:"정일영"}, {t:"나다움", v:"기안84"}] }
        ];
        // 위와 같은 형식으로 15개 문항을 채워주세요. (문항 내용은 위처럼 성격 유형별로 배치하면 됩니다.)
        let counts = {"유재석":0, "침착맨":0, "곽튜브":0, "큐영":0, "정일영":0, "기안84":0};
        let currentQ = 0;
        function loadQ() {
            if(currentQ >= questions.length) { showResult(); return; }
            document.getElementById('q-text').innerText = (currentQ+1) + ". " + questions[currentQ].q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            questions[currentQ].options.forEach(o => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerText = o.t;
                b.onclick = () => { counts[o.v]++; currentQ++; loadQ(); };
                optDiv.appendChild(b);
            });
        }
        function showResult() {
            let res = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('res-title').innerText = "당신은 " + res + " 재질!";
            document.getElementById('result-screen').style.display = 'block';
        }
        loadQ();
    </script>
</body>
</html>
