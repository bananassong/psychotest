<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남자 연예인 성향 테스트</title>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 450px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .progress { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 20px; }
        .bar { width: 0%; height: 100%; background: #ff6b81; border-radius: 3px; transition: 0.3s; }
        .q-box { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .btn { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ffccd5; border-radius: 12px; background: white; cursor: pointer; font-size: 0.95rem; }
        .btn:hover { background: #ff6b81; color: white; }
        #result { display: none; text-align: center; }
        #res-title { color: #ff6b81; }
        #res-desc { line-height: 1.6; color: #555; text-align: left; background: #fff5f7; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz">
            <div class="progress"><div id="bar" class="bar"></div></div>
            <div id="q-text" class="q-box"></div>
            <div id="btns"></div>
        </div>
        <div id="result">
            <h2 id="res-title"></h2>
            <p id="res-desc"></p>
            <button class="btn" onclick="location.reload()">다시하기</button>
        </div>
    </div>
    <script>
        const qList = [
            {q: "약속이 갑자기 다 취소됐다. 나의 반응은?", opt: [
                {t:"당장 혼자 여행 계획 짜기 시작", v:"곽튜브"},
                {t:"쇼핑몰 킁킁대며 신상 구경하기", v:"큐영"},
                {t:"밀린 정산이나 재테크 공부하기", v:"정일영"},
                {t:"그냥 침대에 누워서 멍 때리기", v:"기안84"}
            ]},
            {q: "친구들과 해외여행, 나의 포지션은?", opt: [
                {t:"계획 없이 몸만 따라가는 편", v:"침착맨"},
                {t:"포토스팟만 골라 찍는 화보 담당", v:"큐영"},
                {t:"환율부터 동선까지 계산기 두드리는 총무", v:"정일영"},
                {t:"낯선 골목에서 그림 소재 찾는 예술혼", v:"기안84"}
            ]},
            {q: "누군가 눈앞에서 실수를 저질렀을 때 나는?", opt: [
                {t:"영혼 없이 박수 치며 대충 넘어감", v:"침착맨"},
                {t:"괜찮다며 어깨 두드려주는 형 노릇", v:"곽튜브"},
                {t:"조용히 팩트만 짚어주는 편", v:"정일영"},
                {t:"뭐 그럴 수도 있지 하고 그냥 웃음", v:"기안84"}
            ]},
            {q: "과제나 업무를 처리하는 방식은?", opt: [
                {t:"마감 직전까지 미루다 벼락치기", v:"침착맨"},
                {t:"일단 몸으로 부딪히며 현장에서 해결", v:"곽튜브"},
                {t:"디자인부터 완벽하게 세팅하고 시작", v:"큐영"},
                {t:"영감 올 때까지 하염없이 기다림", v:"기안84"}
            ]},
            {q: "새로운 사람들과 처음 만나는 자리에서 나는?", opt: [
                {t:"낯가림 없이 시니컬한 드립으로 텐션 잡기", v:"침착맨"},
                {t:"먼저 다가가서 넉살 좋게 친해지기", v:"곽튜브"},
                {t:"화려한 스타일로 시선부터 사로잡기", v:"큐영"},
                {t:"조용히 관찰하다가 필요한 말만 하기", v:"정일영"}
            ]},
            {q: "이유 없는 잔소리를 들을 때 나의 대처는?", opt: [
                {t:"일단 상대 입장 먼저 이해하려 함", v:"유재석"},
                {t:"듣는 척하며 딴생각으로 흘려보내기", v:"큐영"},
                {t:"논리적으로 조목조목 반박하기", v:"정일영"},
                {t:"그러려니 하고 그냥 넘어감", v:"기안84"}
            ]},
            {q: "스마트폰 정리 상태는?", opt: [
                {t:"필요한 앱만 칼같이 정리해서 사용", v:"유재석"},
                {t:"여행 사진첩만 빼곡하게 정리되어 있음", v:"곽튜브"},
                {t:"폴더별로 완벽하게 카테고리 정리", v:"정일영"},
                {t:"뭐가 어디 있는지 나도 모름", v:"기안84"}
            ]},
            {q: "길 가다 우연히 로또 1등에 당첨된다면?", opt: [
                {t:"주변 사람들 먼저 챙기고 싶어짐", v:"유재석"},
                {t:"당장 짐 싸서 세계 일주 떠나기", v:"곽튜브"},
                {t:"명품이랑 신상으로 드레스룸 채우기", v:"큐영"},
                {t:"똑같이 살던 대로 그림이나 그림", v:"기안84"}
            ]},
            {q: "인생에서 가장 중요하게 여기는 가치는?", opt: [
                {t:"성실함과 배려로 신뢰 쌓는 삶", v:"유재석"},
                {t:"새로운 경험과 도전이 가득한 삶", v:"곽튜브"},
                {t:"남들과 다른 나만의 확고한 개성", v:"큐영"},
                {t:"차근차근 실력을 쌓아가는 성장", v:"정일영"}
            ]},
            {q: "식당에서 주문한 메뉴가 완전히 잘못 나왔다. 이때 나는?", opt: [
                {t:"웃으면서 정중하게 교체 요청", v:"유재석"},
                {t:"귀찮으니까 그냥 이거 먹자 하고 먹음", v:"침착맨"},
                {t:"정확하게 짚어서 바로 교체 요청", v:"정일영"},
                {t:"어차피 배부르면 그만이라 그냥 먹음", v:"기안84"}
            ]},
            {q: "멘탈이 바닥을 칠 때 나만의 극복 방법은?", opt: [
                {t:"친한 사람들 불러서 수다로 풀기", v:"유재석"},
                {t:"이불 속에 들어가서 조용히 숨기", v:"침착맨"},
                {t:"예쁜 걸 보면서 기분 전환하기", v:"큐영"},
                {t:"그냥 멍하니 시간 흘려보내기", v:"기안84"}
            ]},
            {q: "남들이 나를 평가할 때 가장 듣기 좋은 칭찬은?", opt: [
                {t:"역시 너는 믿음직스럽다는 말", v:"유재석"},
                {t:"너 진짜 웃기다는 말", v:"침착맨"},
                {t:"너 진짜 트렌디하다는 말", v:"큐영"},
                {t:"너 진짜 능력 있다는 말", v:"정일영"}
            ]},
            {q: "쇼핑할 때 나의 소비 패턴은?", opt: [
                {t:"무난하고 실용적인 브랜드 위주", v:"유재석"},
                {t:"필요할 때만 대충 후딱 사는 편", v:"침착맨"},
                {t:"여행 가서 그 나라 특산품 위주로 구매", v:"곽튜브"},
                {t:"꽂히면 일단 지르고 보는 편", v:"기안84"}
            ]},
            {q: "의견 충돌이나 논쟁이 붙었을 때 나는?", opt: [
                {t:"원만하게 중재하며 분위기 풀기", v:"유재석"},
                {t:"그냥 네 말이 맞다 하고 끝내기", v:"침착맨"},
                {t:"형 동생 하면서 웃으면서 넘기기", v:"곽튜브"},
                {t:"논리적으로 근거 들어 반박하기", v:"정일영"}
            ]},
            {q: "오늘 하루를 완벽하게 마무리했다고 느끼는 순간은?", opt: [
                {t:"오늘 할 일 다 끝냈을 때 뿌듯함", v:"유재석"},
                {t:"아무 생각 없이 침대에 누울 때", v:"침착맨"},
                {t:"오늘 찍은 영상 보며 뿌듯할 때", v:"곽튜브"},
                {t:"예쁜 사진 하나 건졌을 때", v:"큐영"}
            ]}
        ];

        const results = {
            "유재석": { title: "🎤 믿음직한 국민 MC (유재석 재질)", desc: "성실함과 배려가 몸에 밴 타입! 누구와 있어도 편안한 분위기를 만들고, 묵묵히 신뢰를 쌓아가는 믿음직한 리더입니다." },
            "침착맨": { title: "😏 시크한 능청 대가 (침착맨 재질)", desc: "겉으론 무심해 보여도 할 말은 다 하는 능청스러운 매력의 소유자! 쿨한 태도 속에 은근한 유머 감각을 숨기고 있는 타입입니다." },
            "곽튜브": { title: "🌏 넉살 좋은 여행 인싸 (곽튜브 재질)", desc: "낯선 곳에서도 금방 친구를 만드는 친화력의 소유자! 새로운 경험과 도전을 즐기며 주변에 긍정 에너지를 퍼뜨리는 타입입니다." },
            "큐영": { title: "✨ 트렌디 감각파 아이콘 (큐영 재질)", desc: "남들과는 다른 확고한 스타일을 가진 감각파! 늘 트렌드의 최전선에서 자신만의 개성을 뽐내는 눈에 띄는 타입입니다." },
            "정일영": { title: "📊 빈틈없는 완벽주의 분석가 (정일영 재질)", desc: "빈틈없이 꼼꼼하고 논리적인 타입! 감정보다는 팩트로 움직이며, 차근차근 실력을 쌓아 신뢰를 얻는 스타일입니다." },
            "기안84": { title: "🎨 자유로운 영혼의 예술가 (기안84 재질)", desc: "정해진 틀에 얽매이지 않는 자유로운 발상의 소유자! 영감이 이끄는 대로 움직이며 자기만의 세계를 즐기는 예술가 타입입니다." }
        };

        let idx = 0;
        let score = { "유재석":0, "침착맨":0, "곽튜브":0, "큐영":0, "정일영":0, "기안84":0 };

        function start() {
            let q = qList[idx];
            document.getElementById('bar').style.width = (idx / qList.length) * 100 + "%";
            document.getElementById('q-text').innerText = (idx + 1) + ". " + q.q;
            let b = document.getElementById('btns');
            b.innerHTML = '';
            q.opt.forEach(o => {
                let btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = o.t;
                btn.onclick = () => {
                    score[o.v]++;
                    idx++;
                    idx === qList.length ? show() : start();
                };
                b.appendChild(btn);
            });
        }

        function show() {
            document.getElementById('bar').style.width = '100%';
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            let maxScore = Math.max(...Object.values(score));
            let topCandidates = Object.keys(score).filter(key => score[key] === maxScore);
            let best = topCandidates[Math.floor(Math.random() * topCandidates.length)];

            document.getElementById('res-title').innerText = results[best].title;
            document.getElementById('res-desc').innerText = results[best].desc;
        }

        start();
    </script>
</body>
</html>
